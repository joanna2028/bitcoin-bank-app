name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: fwal/setup-swift@v2
        with:
          swift-version: '5.9'
      - name: Build
        run: swift build --disable-sandbox -v
      - name: Run tests
        run: swift test --disable-sandbox -v
