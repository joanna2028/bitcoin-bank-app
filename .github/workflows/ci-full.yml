name: CI - macOS & Ubuntu

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install autoconf automake libtool pkg-config libsecp256k1 || true
      - name: Set up Swift
        uses: fwal/setup-swift@v2
        with:
          swift-version: '5.9'
      - name: Build
        run: swift build --disable-sandbox -v
      - name: Run tests
        run: swift test --disable-sandbox -v

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libtool pkg-config libgmp-dev curl
      - name: Build and install libsecp256k1
        run: |
          git clone https://github.com/bitcoin-core/secp256k1.git /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure --enable-module-ext --enable-experimental
          make -j2
          sudo make install
          sudo ldconfig || true
      - name: Set up Swift
        uses: fwal/setup-swift@v2
        with:
          swift-version: '5.9'
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
